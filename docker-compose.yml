services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kbo
      POSTGRES_USER: kbo
      POSTGRES_PASSWORD: kbo
    ports:
      - "5432:5432"
    volumes:
      - kbo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbo"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 앱까지 한 방에 띄우려면 아래 주석을 해제 (docker compose up).
  # 로컬 개발 중엔 db 만 띄우고 앱은 ./gradlew bootRun 으로 돌리는 게 편하다.
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kbo
      SPRING_DATASOURCE_USERNAME: kbo
      SPRING_DATASOURCE_PASSWORD: kbo
    ports:
      - "8080:8080"

volumes:
  kbo_pgdata:
