# Render 블루프린트 — 백엔드 API 한 개. render.com > New > Blueprint 에서 이 레포를 연결하면 생성된다.
#
# 코드를 Render 가 빌드하지 않는다. GitHub Actions 가 테스트를 통과한 커밋으로 이미지를 만들어
# GHCR 에 올리고, 배포 훅으로 **그 이미지(:커밋 SHA)** 를 배포하게 한다(.github/workflows/ci.yml).
# 그래서 여기에는 자동 배포 설정이 없다 — 이미지 기반 서비스는 새 이미지가 올라와도 스스로 배포하지 않는다.
#
# DB 는 Render 가 아니라 Neon(무료, 만료 없음)이다. Render 무료 Postgres 는 30일 뒤 만료된다.
# 무료 웹 서비스는 15분 요청이 없으면 잠들고, 다음 요청 때 1분가량 걸려 깨어난다.

services:
  - type: web
    name: kbo-predictor-api
    runtime: image
    image:
      url: ghcr.io/hyunseungbeom/kbo-predictor-api:latest
    plan: free
    region: singapore   # 한국에서 가장 가깝다. Neon 도 AWS 싱가포르(ap-southeast-1)에 만든다
    healthCheckPath: /actuator/health
    envVars:
      # 실데이터 수집 출처(DaumKboScheduleSource). 빠뜨리면 샘플 출처가 켜져 실제 결과를 가짜 점수로 덮어쓴다 —
      # 배포 파이프라인이 /actuator/info 의 ingestSource 를 확인해 막는다
      - key: SPRING_PROFILES_ACTIVE
        value: live
      # Neon 대시보드 > Connect 에서 **풀러가 아닌 직접 연결** 호스트를 JDBC 형식으로 넣는다
      # 예: jdbc:postgresql://ep-xxx.ap-southeast-1.aws.neon.tech/kbo?sslmode=require
      # (Flyway 마이그레이션이 풀러의 트랜잭션 모드와 맞지 않을 수 있어 직접 연결을 쓴다)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # 프론트(Vercel) 주소. 콤마로 여러 개 가능
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # 수집 API 토큰 — GitHub production 환경의 ADMIN_TOKEN 과 같은 값
      - key: APP_ADMIN_TOKEN
        sync: false
      # 힙을 컨테이너 메모리(무료 512MB)에 맞춘다
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70.0
