spring:
  application:
    name: kbo-predictor

  # 배포(Render 등)에선 DB_HOST/DB_PORT/... 개별 값으로 조립. 로컬은 기본값.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kbo}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:kbo}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:kbo}}

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 관리, JPA는 검증만
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${PORT:8080}   # Render 등은 PORT 주입

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true   # info.* 를 /actuator/info 로 노출

# 배포 파이프라인이 "방금 올린 커밋이 실제로 떠 있는가" 를 확인하는 값. 이미지 빌드 때 주입된다.
info:
  app:
    commit: ${APP_COMMIT:local}

app:
  admin:
    # 수집 API 토큰. 비어 있으면 수집 API 는 항상 403 이다(IngestController.authorized).
    token: ${APP_ADMIN_TOKEN:}

  auth:
    # 프론트 주소 — 로그인 후 돌려보낼 곳. 배포에선 Vercel 주소.
    web-base-url: ${APP_AUTH_WEB_BASE_URL:http://localhost:3000}
    # 로컬(http)에서는 Secure 쿠키가 안 붙으므로 끈다. 배포는 항상 true.
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
    kakao:
      # 비어 있으면 로그인 기능이 꺼진다(503) — 반쯤 켜진 인증이 제일 위험하다.
      client-id: ${APP_AUTH_KAKAO_CLIENT_ID:}
      client-secret: ${APP_AUTH_KAKAO_CLIENT_SECRET:}
      redirect-uri: ${APP_AUTH_KAKAO_REDIRECT_URI:}
